<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AutoCropper - 智能图像批量裁剪工作台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=2.0">
</head>
<body>
    <div class="workbench-layout">
        <!-- 1. 左侧面板：文件输入与导出 -->
        <aside class="panel-left">
            <div class="panel-section file-manager-section">
                <div class="section-header">
                    <span>扫描件列表</span>
                    <span class="draft-indicator" id="draftIndicator" title="编辑进度实时保存在浏览器缓存，按 Ctrl+S 立即暂存">● 草稿已暂存</span>
                </div>
                <div class="ctrl-group">
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                    <div style="display: flex; gap: 6px;">
                        <button id="uploadBtn" class="btn-secondary" style="flex: 1;">添加本地图片</button>
                        <button id="clearAllBtn" class="btn-secondary" style="width: 52px;" title="清空全部已载入文件">清空</button>
                    </div>
                </div>
                <div id="batchSummary" class="summary-badge">0 个文件 · 共 0 张子图</div>
                <div id="fileListContainer" class="file-list-box"></div>
            </div>

            <!-- 导出操作：极简普通按钮，避免占据左侧首屏信息量 -->
            <div class="panel-section export-section" style="display: flex; flex-direction: column; gap: 6px;">
                <button id="openExportModalBtn" class="btn-primary" style="height: 32px; width: 100%;" disabled>导出切片 (待添加图片)</button>
                <button id="openLastExportDirBtn" class="btn-secondary" style="height: 28px; width: 100%; display: none;" type="button" title="在系统文件资源管理器中打开导出目录">打开导出文件夹 ↗</button>
            </div>
        </aside>

        <!-- 2. 中间面板：视口工作区 -->
        <main class="panel-center">
            <!-- 核心画布显示区 -->
            <div class="canvas-viewport" id="canvasViewport">
                <div class="upload-dropzone" id="dropZone">
                    <div class="drop-title">拖拽扫描件至此区域</div>
                    <div class="drop-sub">支持批量导入与多图自动识别，或点击左侧“添加本地图片”</div>
                </div>

                <!-- 连续级联多图流容器：支持滚轮连续通览所有扫描件 -->
                <div class="stream-container" id="streamContainer" style="display: none;"></div>

                <!-- 兼容旧单画布隐藏备用 -->
                <canvas id="mainCanvas" style="display: none;"></canvas>

                <!-- 批量导入与自动检测全局 Loading 指示器 -->
                <div id="viewportLoading" class="viewport-loading" style="display: none;">
                    <div class="loading-card">
                        <div class="loading-header">
                            <span class="loading-title">正在批量导入扫描件并智能检测</span>
                            <span id="loadingPercentText" class="loading-percent">0%</span>
                        </div>
                        <div class="loading-progress-track">
                            <div id="loadingProgressFill" class="loading-progress-fill"></div>
                        </div>
                        <div class="loading-info-row">
                            <span id="loadingFilename" class="loading-filename">准备导入...</span>
                            <span id="loadingCountText" class="loading-count">[0 / 0]</span>
                        </div>
                        <div class="loading-detail" id="loadingDetail">正在计算灰度直方图并自适应定位多图边缘...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 全局拖放遮罩层 -->
    <div id="dragOverlay" class="drag-overlay" style="display: none;">
        <div class="drag-overlay-box">释放鼠标以导入扫描件</div>
    </div>

    <!-- 犄角旮旯：右下角极简控制台浮动停靠栏与浮窗 -->
    <div class="corner-console-dock">
        <span class="corner-status-msg" id="statusbarMsg" style="display: none;">控制台就绪</span>
        <button id="consoleToggle" class="corner-console-btn" title="查看工程控制台日志">控制台日志 ▤</button>
    </div>
    <div id="consoleDrawer" class="corner-console-popover" style="display: none;">
        <div class="corner-console-header">
            <span class="corner-console-title">工程控制台日志 (CONSOLE LOGS)</span>
            <div class="corner-console-actions">
                <button id="clearLogBtn" class="corner-btn-mini">清空</button>
                <button id="closeLogBtn" class="corner-btn-mini">收起 ✕</button>
            </div>
        </div>
        <textarea id="consoleLog" readonly>控制台就绪，请上传文件开始处理...</textarea>
    </div>

    <!-- 状态保存与操作反馈 Toast -->
    <div id="statusToast" class="status-toast" style="display: none;"></div>

    <!-- 导出设置弹窗：点击左侧“导出切片”后弹出，减少首屏信息量 -->
    <div id="exportModal" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">导出切片</span>
                <button id="closeExportModalBtn" class="modal-close-btn" type="button" title="关闭 (Esc)">✕</button>
            </div>
            <div class="modal-body">
                <div class="ctrl-group">
                    <div class="ctrl-label-row"><span>保存位置</span></div>
                    <select id="exportPathModeSelect" class="select-input">
                        <option value="custom" selected>保存到本机文件夹</option>
                        <option value="zip">打包为 ZIP 压缩包下载</option>
                    </select>
                    <div id="customPathRow" style="display: flex; gap: 6px; margin-top: 6px;">
                        <input type="text" id="customPathInput" class="text-input" placeholder="点击右侧“浏览...”选择或输入绝对路径" style="flex: 1;">
                        <button id="browseCustomPathBtn" class="btn-secondary" style="padding: 0 12px; white-space: nowrap; height: 28px; font-size: 12px; flex-shrink: 0;" type="button">浏览...</button>
                    </div>
                    <input type="hidden" id="exportType" value="local">
                    <div class="export-dest-hint" id="exportDestHint" style="margin-top: 6px;">保存位置: 未指定路径，请点击“浏览...”选择文件夹</div>
                </div>


                <div class="ctrl-group">
                    <div class="ctrl-label-row"><span>图片格式</span></div>
                    <select id="exportFormat" class="select-input">
                        <option value="jpg" selected>JPG (高质量 / 推荐)</option>
                        <option value="png">PNG (无损画质 / 体积较大)</option>
                    </select>
                </div>

                <div class="ctrl-group">
                    <div class="ctrl-label-row">
                        <span>命名格式</span>
                        <span class="help-tooltip" title="通配符: {original} 原文件名, {index:02d} 两位编号 (01, 02...), {index} 序号">?</span>
                    </div>
                    <input type="text" id="namingTemplate" value="{original}_{index:02d}" class="text-input">
                </div>

                <div class="ctrl-group" style="margin-bottom: 0;">
                    <label class="checkbox-row">
                        <input type="checkbox" id="flatExport">
                        <span>平铺输出（所有切片直接保存，不按原图分目录）</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <span id="modalSummaryHint" class="modal-summary-hint">共 0 张切片</span>
                <div class="modal-actions">
                    <button id="cancelExportModalBtn" class="btn-secondary" type="button">取消</button>
                    <button id="exportBtn" class="btn-primary" type="button">确认导出</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js?v=2.0"></script>
</body>
</html>
