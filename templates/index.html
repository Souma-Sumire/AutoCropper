<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AutoCropper Local Debugger - 自动裁剪调试工具</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="main-container">
        <!-- 左侧控制栏 -->
        <div class="sidebar">
            <!-- 文件选择 -->
            <div class="sidebar-section file-list-section">
                <h3>图片输入源 (多选)</h3>
                <div class="ctrl-group">
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
                    <button id="uploadBtn" class="btn-secondary">选择本地图片</button>
                    <div id="fileMeta" style="font-size: 11px; margin-top: 5px; color: var(--text-muted);">
                        等待文件载入...
                    </div>
                </div>
                <div id="batchSummary" style="font-size: 11px; margin-top: 5px; color: var(--accent-color); font-weight: bold; font-family: monospace;">
                    [ 已载入: 0 个文件 | 共检测到 0 张子照片 ]
                </div>
                <div id="importProgress" class="import-progress" hidden>
                    <div id="importProgressText" class="import-progress-text">准备导入…</div>
                    <div class="import-progress-track">
                        <div id="importProgressFill" class="import-progress-fill"></div>
                    </div>
                </div>
                <!-- 批量列表容器 -->
                <div id="fileListContainer"></div>
            </div>

            <!-- 全局裁剪与导出动作区 -->
            <div class="sidebar-section">
                <h3>全局裁剪与导出</h3>
                <div class="ctrl-group">
                    <div class="ctrl-label-row">
                        <span>导出目标类型</span>
                    </div>
                    <select id="exportType">
                        <option value="zip">下载压缩包 (ZIP)</option>
                        <option value="local">直接保存到本地项目 output 目录</option>
                    </select>
                </div>
                <div class="ctrl-group">
                    <label class="flat-export-label">
                        <input type="checkbox" id="flatExport">
                        <span>不建立子文件夹（全部导出到同一目录）</span>
                    </label>
                </div>
                <button id="exportBtn" class="btn-primary" disabled>开始执行图像裁剪</button>
                <button id="syncParamsBtn" class="btn-secondary" style="margin-top: 10px;" disabled>同步当前参数到所有图片</button>
            </div>
        </div>

        <!-- 右侧工作区 -->
        <div class="workspace">
            <!-- 视图模式切换 -->
            <div class="tabs-bar">
                <div class="tab-item active" data-mode="original">[1. 原图与裁剪框]</div>
                <div class="tab-item" data-mode="threshold">[2. 二值化调试图]</div>
                <div class="tab-item" data-mode="blurred">[3. 灰度模糊图]</div>
            </div>

            <!-- 画布呈现区 (支持 PDF 纵向级联排版) -->
            <div class="canvas-container" id="canvasContainer" style="display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: flex-start;">
                <div class="upload-box" id="dropZone" style="max-width: 540px; border: 2px dashed var(--border-color); padding: 50px 30px;">
                    <div style="font-size: 13px; font-weight: bold; margin-bottom: 10px; color: var(--text-main); font-family: monospace;">
                        [ 拖拽任意数量的扫描件到此窗口任意位置 ]
                    </div>
                    <div style="font-size: 11px; color: var(--text-muted); font-family: monospace;">
                        支持多文件批量上传与识别 | 或点击左侧“选择本地图片”按钮进行导入
                    </div>
                </div>
            </div>

            <!-- 日志栏 -->
            <div class="console-panel">
                <div class="console-title">工程控制台日志 (CONSOLE LOGS)</div>
                <textarea id="consoleLog" readonly>控制台就绪，请上传文件开始处理...</textarea>
            </div>
        </div>
    </div>

    <!-- 全局拖放遮罩层 -->
    <div id="dragOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 122, 204, 0.12); border: 4px dashed var(--accent-color); z-index: 9999; justify-content: center; align-items: center; pointer-events: none; box-sizing: border-box;">
        <div style="background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 20px 40px; font-size: 13px; font-weight: bold; color: var(--text-main); font-family: monospace;">
            [ 释放鼠标以批量导入扫描件 ]
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
