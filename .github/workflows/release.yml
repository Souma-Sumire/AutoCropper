name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/

      - name: Build Standalone Executable via PyInstaller
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile `
            --name "AutoCropper" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "models;models" `
            app.py

      - name: Verify Executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AutoCropper.exe")) {
            Write-Error "dist/AutoCropper.exe not found!"
            exit 1
          }
          $sizeMb = [math]::Round((Get-Item "dist/AutoCropper.exe").Length / 1MB, 2)
          Write-Host "AutoCropper.exe generated successfully! Size: $sizeMb MB"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/AutoCropper.exe
          generate_release_notes: true
