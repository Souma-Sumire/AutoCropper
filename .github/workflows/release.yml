name: Build and Release Executable

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '发布版本 Tag（例如 v1.0.0，留空则仅执行构建验证不发布）'
        required: false
        type: string
        default: ''
      draft:
        description: '是否保存为草稿 (Draft)'
        required: false
        type: boolean
        default: false
      prerelease:
        description: '是否设为预发布 (Pre-release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Single Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Pytest Suite
        run: |
          python -m pytest tests/

      - name: Build Standalone Executables via PyInstaller
        shell: pwsh
        run: |
          # 1. 构建单文件版（带模块精简以降低解压体积与冷启动耗时）
          pyinstaller --noconfirm --clean --onefile `
            --name "AutoCropper" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "models;models" `
            --hidden-import "waitress" `
            --exclude-module "tkinter" `
            --exclude-module "unittest" `
            --exclude-module "pydoc" `
            app.py

          # 2. 构建免解压便携目录版（冷启动秒开，彻底免除 Temp 目录解压开销）
          pyinstaller --noconfirm --clean --onedir `
            --name "AutoCropper-Portable" `
            --add-data "templates;templates" `
            --add-data "static;static" `
            --add-data "models;models" `
            --hidden-import "waitress" `
            --exclude-module "tkinter" `
            --exclude-module "unittest" `
            --exclude-module "pydoc" `
            app.py

          # 压缩便携目录为 zip 供极速启动用户直接使用
          Compress-Archive -Path "dist/AutoCropper-Portable/*" -DestinationPath "dist/AutoCropper-Portable.zip" -Force

      - name: Verify Executables
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AutoCropper.exe")) {
            Write-Error "dist/AutoCropper.exe not found!"
            exit 1
          }
          if (-not (Test-Path "dist/AutoCropper-Portable.zip")) {
            Write-Error "dist/AutoCropper-Portable.zip not found!"
            exit 1
          }
          $sizeOnefile = [math]::Round((Get-Item "dist/AutoCropper.exe").Length / 1MB, 2)
          $sizeZip = [math]::Round((Get-Item "dist/AutoCropper-Portable.zip").Length / 1MB, 2)
          Write-Host "Build complete! SingleFile: $sizeOnefile MB, Portable zip: $sizeZip MB"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist/AutoCropper.exe
            dist/AutoCropper-Portable.zip
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
